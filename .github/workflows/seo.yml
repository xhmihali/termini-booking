# Free for public repositories. Rebuilds the city pages for Google every night,
# and the daily database request also keeps the free Supabase project from pausing.
name: City pages for Google
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['config.js', 'tools/**']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-seo.mjs
      - name: Save the pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A qytet sitemap.xml robots.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update city pages" && git push)
